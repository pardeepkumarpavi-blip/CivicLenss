services:
  mongodb:
    image: mongo:7.0
    container_name: civiclens-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: civiclens
    networks:
      - civiclens-network

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: civiclens-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/civiclens
      - JWT_ACCESS_SECRET=civiclens-prod-access-token-secret-jwt-key
      - JWT_REFRESH_SECRET=civiclens-prod-refresh-token-secret-jwt-key
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FRONTEND_URL=http://localhost:5173
      - BOOTSTRAP_ADMIN_NAME=Super Administrator
      - BOOTSTRAP_ADMIN_EMAIL=admin@civiclens.local
      - BOOTSTRAP_ADMIN_PASSWORD=CivicLensAdmin@2026
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - civiclens-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: civiclens-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - civiclens-network

volumes:
  mongodb_data:
  backend_uploads:

networks:
  civiclens-network:
    driver: bridge
